  const keyText=new URLSearchParams(location.hash.slice(1)).get('key');
  if(!keyText||!/^[\w-]{43}$/.test(keyText)){document.getElementById('status').hidden=false;return;}
  try{
    const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const key=await crypto.subtle.importKey('raw',bytes(keyText.replace(/-/g,'+').replace(/_/g,'/')+'='),'AES-GCM',false,['decrypt']);
    const ciphertext=bytes(document.getElementById('payload').textContent);
    const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:ciphertext.subarray(0,12)},key,ciphertext.subarray(12));
    const stream=new Blob([decrypted]).stream().pipeThrough(new DecompressionStream('gzip'));
    const {pages,assets}=await new Response(stream).json();
    const requested=new URLSearchParams(location.search).get('page')||'index';
    const file=requested+'.html';
    if(!Object.hasOwn(pages,file))throw new Error('Unknown page');
    const output=pages[file].replace(/href="([a-z-]+)\.html"/g,(_,slug)=>'href="?page='+slug+'#key='+keyText+'"')
      .replace(/assets\/[a-zA-Z0-9_./-]+\.(?:webp|jpg|woff2)/g,name=>assets[name]);
    document.open();
    document.write(output);
    document.close();
